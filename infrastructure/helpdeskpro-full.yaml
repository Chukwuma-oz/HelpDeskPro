AWSTemplateFormatVersion: '2010-09-09'

Description: >
  HelpDeskPro highly available application using
  ALB, Auto Scaling, EC2, RDS, S3 and CloudWatch.

Parameters:

  InstanceType:
    Type: String
    Default: t3.micro

  DBUsername:
    Type: String
    Default: admin

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:

  # ==========================================
  # VPC
  # ==========================================

  HelpDeskVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: HelpDeskPro-VPC

  # ==========================================
  # INTERNET GATEWAY
  # ==========================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: HelpDeskPro-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref HelpDeskVPC
      InternetGatewayId: !Ref InternetGateway

  # ==========================================
  # PUBLIC SUBNET 1
  # ==========================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HelpDeskVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: HelpDeskPro-PublicSubnet-1

  # ==========================================
  # PUBLIC SUBNET 2
  # ==========================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HelpDeskVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: HelpDeskPro-PublicSubnet-2

  # ==========================================
  # ROUTE TABLE
  # ==========================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HelpDeskVPC
      Tags:
        - Key: Name
          Value: HelpDeskPro-PublicRoutes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # ==========================================
  # ALB SECURITY GROUP
  # ==========================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to ALB
      VpcId: !Ref HelpDeskVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: HelpDeskPro-ALB-SG

  # ==========================================
  # EC2 SECURITY GROUP
  # ==========================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB
      VpcId: !Ref HelpDeskVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      Tags:
        - Key: Name
          Value: HelpDeskPro-EC2-SG

  # ==========================================
  # APPLICATION LOAD BALANCER
  # ==========================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: HelpDeskPro-ALB
      Scheme: internet-facing
      Type: application

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      SecurityGroups:
        - !Ref ALBSecurityGroup

      Tags:
        - Key: Name
          Value: HelpDeskPro-ALB

  # ==========================================
  # TARGET GROUP
  # ==========================================

  HelpDeskTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref HelpDeskVPC
      Port: 8080
      Protocol: HTTP

      TargetType: instance

      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckPort: '8080'
      HealthCheckProtocol: HTTP

      Matcher:
        HttpCode: '200'

      Tags:
        - Key: Name
          Value: HelpDeskPro-TargetGroup

  # ==========================================
  # ALB LISTENER
  # ==========================================

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref HelpDeskTargetGroup

  # ==========================================
  # EC2 LAUNCH TEMPLATE
  # ==========================================

  HelpDeskLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: HelpDeskPro-LaunchTemplate

      LaunchTemplateData:

        InstanceType: !Ref InstanceType

        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

        SecurityGroupIds:
          - !Ref EC2SecurityGroup

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash

            dnf update -y

            dnf install -y nodejs npm

            mkdir -p /opt/helpdeskpro

            cd /opt/helpdeskpro

            cat > package.json <<'EOF'
            {
              "name": "helpdeskpro",
              "version": "1.0.0",
              "main": "server.js",
              "dependencies": {
                "express": "^5.1.0",
                "cors": "^2.8.5"
              }
            }
            EOF

            npm install

            cat > server.js <<'EOF'
            const express = require('express');
            const cors = require('cors');

            const app = express();

            app.use(cors());
            app.use(express.json());

            app.get('/health', (req, res) => {
              res.json({
                status: 'ok',
                server: process.env.HOSTNAME
              });
            });

            app.get('/api/tickets', (req, res) => {
              res.json([
                {
                  id: 1,
                  name: 'Demo User',
                  email: 'demo@example.com',
                  subject: 'Cannot access email',
                  description: 'Email login is not working.',
                  priority: 'Medium',
                  status: 'Open'
                },
                {
                  id: 2,
                  name: 'Admin User',
                  email: 'admin@example.com',
                  subject: 'Password reset',
                  description: 'Password reset required.',
                  priority: 'High',
                  status: 'Open'
                }
              ]);
            });

            app.listen(8080, '0.0.0.0', () => {
              console.log('HelpDeskPro running on port 8080');
            });
            EOF

            npm install express cors

            node server.js > /var/log/helpdeskpro.log 2>&1 &

  # ==========================================
  # AUTO SCALING GROUP
  # ==========================================

  HelpDeskAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup

    Properties:

      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '4'

      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      TargetGroupARNs:
        - !Ref HelpDeskTargetGroup

      HealthCheckType: ELB
      HealthCheckGracePeriod: 120

      LaunchTemplate:
        LaunchTemplateId: !Ref HelpDeskLaunchTemplate
        Version: !GetAtt HelpDeskLaunchTemplate.LatestVersionNumber

      Tags:
        - Key: Name
          Value: HelpDeskPro-EC2
          PropagateAtLaunch: true

  # ==========================================
  # AUTO SCALING POLICY
  # ==========================================

  CPUScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref HelpDeskAutoScalingGroup

      PolicyType: TargetTrackingScaling

      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization

        TargetValue: 60

# ==========================================
# OUTPUTS
# ==========================================

Outputs:

  LoadBalancerURL:
    Description: HelpDeskPro Application Load Balancer
    Value: !Sub
      - http://${DNSName}
      - DNSName: !GetAtt ApplicationLoadBalancer.DNSName

  LoadBalancerDNS:
    Description: ALB DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  VPCId:
    Description: HelpDeskPro VPC
    Value: !Ref HelpDeskVPC

  AutoScalingGroup:
    Description: HelpDeskPro Auto Scaling Group
    Value: !Ref HelpDeskAutoScalingGroup